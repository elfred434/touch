name: Android — build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TOUCH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing TOUCH_RELEASE_KEYSTORE_BASE64 secret'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/touch-release-key.p12"
          chmod 600 "$RUNNER_TEMP/touch-release-key.p12"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/touch-release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TOUCH_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TOUCH_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TOUCH_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Touch-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Touch ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            VersionCode: ${{ env.VERSION_CODE }}

            APK Android signé, généré automatiquement par GitHub Actions.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
